# Publishes dashboard/ to GitHub Pages.
# One-time setup: Settings > Pages > Source = "GitHub Actions", and two REPOSITORY SECRETS
# (Settings > Secrets and variables > Actions > Secrets; not inside an environment):
#   SUPABASE_URL              https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...   (NEVER the secret key)
# Secrets, not variables: GitHub masks secrets in the public run logs, so even a
# mis-pasted secret key can never be printed there.
name: dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml", ".github/scripts/write_dashboard_config.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js (publishable key only)
        id: cfg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 .github/scripts/write_dashboard_config.py dashboard/config.js
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - if: steps.cfg.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
