# Publishes dashboard/ to GitHub Pages.
# One-time setup: Settings > Pages > Source = "GitHub Actions", and repository
# variables (Settings > Secrets and variables > Actions > Variables):
#   SUPABASE_URL              https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...   (NEVER the secret key)
name: dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml", ".github/scripts/write_dashboard_config.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip quietly on push until the dashboard is configured; a manual run always tries (and explains what's missing).
    if: vars.SUPABASE_PUBLISHABLE_KEY != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js (publishable key only)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 .github/scripts/write_dashboard_config.py dashboard/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
